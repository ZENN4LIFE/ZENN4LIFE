<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bake, Breathe, Enjoy — Zenn4Life</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #f2e8d5;
  min-height: 100vh;
  background: #0b1e1b;
}
.page-wrap {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
}
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: url("bg.jpg") center/cover no-repeat;
}
.bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(8, 22, 19, 0.55);
}
.content {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.logo {
  width: 100%;
  max-width: 240px;
  height: auto;
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  margin-bottom: 28px;
}
.mission {
  text-align: center;
  font-size: 15px;
  line-height: 1.7;
  color: #f2e8d5;
  max-width: 560px;
  margin-bottom: 36px;
  padding: 18px 22px;
  background: rgba(6,17,15,0.5);
  border-radius: 12px;
  border: 1px solid rgba(212,175,55,0.22);
  backdrop-filter: blur(4px);
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(212,175,55,0.85);
  margin-bottom: 14px;
  width: 100%;
  text-align: center;
}
.buttons {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 40px;
}
.btn {
  display: block;
  width: 100%;
  padding: 18px 22px;
  border-radius: 12px;
  background: rgba(9,26,23,0.62);
  border: 1px solid rgba(212,175,55,0.35);
  color: #f2e8d5;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.btn:hover {
  background: rgba(19,46,41,0.78);
  border-color: rgba(212,175,55,0.6);
  transform: translateY(-1px);
}
.btn:active {
  transform: translateY(0);
}
.btn .label {
  display: block;
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 4px;
}
.btn .sub {
  display: block;
  font-size: 13px;
  color: rgba(242,232,213,0.6);
  font-weight: 400;
}
.btn.primary {
  background: rgba(212,175,55,0.18);
  border-color: rgba(212,175,55,0.45);
}
.btn.primary:hover {
  background: rgba(212,175,55,0.3);
  border-color: rgba(212,175,55,0.65);
}
.legal {
  width: 100%;
  max-width: 640px;
  margin-top: auto;
  padding-top: 32px;
  font-size: 12px;
  line-height: 1.6;
  color: rgba(242,232,213,0.45);
  text-align: center;
}
.legal a {
  color: rgba(242,232,213,0.6);
  text-decoration: underline;
}
@media (max-width: 480px) {
  .page-wrap { padding: 28px 16px; }
  .logo { max-width: 180px; }
  .mission { font-size: 14px; padding: 14px 16px; }
  .btn { padding: 16px 18px; }
}

</head><body><div class="bg"></div><div class="page-wrap"><div class="content"><a href="index.html"><img src="logo.jpg" alt="Zenn4Life" class="logo"></a><h1>Bake, Breathe, Enjoy</h1><div class="mission">Let baking become a moment of presence. Put on calming music, take a breath, and allow yourself to enjoy creating without pressure for perfection. It is less about the finished dessert and more about making space for joy.</div><div class="buttons"><a href="index.html" class="btn"><span class="label">Back to Zenn4Life</span><span class="sub">Return to the home page</span></a></div></div></div></body></html>
